name: CI Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy wandb transformers pytorch-optimizer einops scikit-learn h5py matplotlib plotly tqdm requests uproot awkward
          pip install pytest pytest-timeout

      - name: Run import tests
        run: pytest tests/test_imports.py -v

      - name: Run model tests
        run: pytest tests/test_models.py -v

      - name: Run training integration tests
        env:
          WANDB_MODE: disabled
        run: pytest tests/test_training.py -v --timeout=120

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (errors only)
        run: ruff check src/ --select E9,F63,F7,F82 --no-fix
